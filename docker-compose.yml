version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: medpag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medpag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medpag_dev}
      POSTGRES_DB: ${POSTGRES_DB:-medpag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medpag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medpag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medpag-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medpag}:${POSTGRES_PASSWORD:-medpag_dev}@postgres:5432/${POSTGRES_DB:-medpag}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev_secret_mude_em_producao_32_chars_min}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medpag-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medpag}:${POSTGRES_PASSWORD:-medpag_dev}@postgres:5432/${POSTGRES_DB:-medpag}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev_secret_mude_em_producao_32_chars_min}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    depends_on:
      - postgres
      - redis
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medpag-flower
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: celery -A app.workers.celery_app flower --port=5555

  frontend:
    image: node:20-alpine
    container_name: medpag-frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_storage:
  frontend_node_modules:
