[alembic]
# Caminho relativo ao backend/
script_location = alembic

# Template de nomes — inclui timestamp para ordem cronológica
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone para os timestamps
timezone = UTC

# Tamanho máximo do slug
truncate_slug_length = 40

# Versão do path (nada especial)
prepend_sys_path = .
version_path_separator = os
sourceless = false

# URL é resolvida via env.py (lê DATABASE_URL e converte asyncpg → psycopg2)
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Roda ruff format depois de gerar migration (deixa o código bonito)
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
